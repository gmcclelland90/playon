name: fixtures.fake-http-game
version: 0.1.0
game: Fake HTTP Game
description: Hermetic CI fixture that simulates a joinable game server.
tags:
  - fixture
  - ci
os:
  - linux
  - windows
arch:
  - amd64
containerSupport: full
requiredTools:
  - container.create
  - container.start
ports:
  - name: game
    protocol: tcp
    default: 8080
dependencies: []
healthChecks:
  - id: process
    type: process_running
    onFail: restart
  - id: game-port
    type: tcp_port
    port: 8080
    onFail: escalate
