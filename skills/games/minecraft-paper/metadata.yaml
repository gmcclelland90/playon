name: games.minecraft-paper
version: 0.1.0
game: Minecraft (Paper)
description: Paper Minecraft dedicated server — container-first LAN skill.
tags:
  - minecraft
  - paper
  - reference
  - docker
theme:
  id: paper
  primaryHue: 145
os:
  - linux
  - windows
arch:
  - amd64
containerSupport: full
dockerImage: itzg/minecraft-server:latest
dockerDataMount: /data
dockerEnv:
  EULA: "TRUE"
  TYPE: PAPER
  ONLINE_MODE: "FALSE"
  MAX_PLAYERS: "20"
  ENABLE_RCON: "true"
adminDialect: mc_rcon
join:
  clientSetupNotes: >
    Open Minecraft Java Edition → Multiplayer → Direct Connection → {{endpoint}}
minRamMb: 2048
requiredTools:
  - servers_create_from_skill
  - servers_start
  - panel_publish
  - rcon_exec
  - rcon_say
ports:
  - name: game
    protocol: tcp
    default: 25565
  - name: rcon
    protocol: tcp
    default: 25575
dependencies:
  - platform.docker-basics
  - platform.networking-lan
  - platform.admin-protocols
  - platform.server-auth
  - platform.capacity
  - platform.hostability
healthChecks:
  - id: process
    type: process_running
    onFail: restart
  - id: game-port
    type: tcp_port
    portName: game
    port: 25565
    onFail: restart
