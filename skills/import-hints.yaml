# Layout sniffers for local/SFTP import → suggested catalog skill.
# Keep game-specific detection here — not in the control plane.
version: 1
# Rule of thumb: fingerprint install binaries/launchers, not save/config-only trees.
hints:
  - id: minecraft_java_layout
    anyFiles:
      - paper.jar
      - purpur.jar
      - spigot.jar
      - server.jar
      - minecraft_server.jar
      - fabric-server-launch.jar
    suggestedGame: Minecraft
    suggestedSkillName: games.minecraft-paper

  - id: rust_dedicated_layout
    anyFiles:
      - RustDedicated
      - RustDedicated.exe
    suggestedGame: Rust
    suggestedSkillName: games.rust

  - id: valheimish_layout
    anyFiles:
      - valheim_server
      - valheim_server.x86_64
      - valheim_server.exe
    suggestedGame: Valheim
    suggestedSkillName: games.valheim

  - id: ut99_layout
    anyFiles:
      - UCC.exe
      - ucc-bin
      - ucc-bin-linux-amd64
    suggestedGame: Unreal Tournament 99
    suggestedSkillName: games.unreal-tournament-99

  - id: terraria_layout
    anyFiles:
      - TerrariaServer.exe
      - TerrariaServer.bin.x86_64
    suggestedGame: Terraria
    suggestedSkillName: games.terraria

  - id: factorio_layout
    anyFiles:
      - bin/x64/factorio
      - bin/x64/factorio.exe
      - factorio
      - factorio.exe
    suggestedGame: Factorio
    suggestedSkillName: games.factorio

  - id: project_zomboid_layout
    anyFiles:
      - ProjectZomboid64.exe
      - ProjectZomboid64
      - StartServer64.sh
      - StartServer64.bat
      - projectzomboid-server.sh
      - start-server.sh
    suggestedGame: Project Zomboid
    suggestedSkillName: games.project-zomboid
    manage:
      userdataHomeDirs:
        - Zomboid
      serverNameArg: servername
      adminPasswordArg: true
      worldSubdirs:
        - Server
        - db
        - Saves/Multiplayer
