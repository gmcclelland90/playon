# Example only — PlayOn will drive containers via the runtime adapter.
services:
  paper:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MAX_PLAYERS: "20"
    ports:
      - "25565:25565"
    volumes:
      - ./game:/data
