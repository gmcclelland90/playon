name: games.factorio
version: 0.1.0
game: Factorio
description: >
  Factorio headless dedicated server via factoriotools/factorio Docker image.
  Great LAN/session factory; pin versions for long saves.
tags:
  - factorio
  - docker
  - lan
  - factory
theme:
  id: steel
  primaryHue: 45
os:
  - linux
  - windows
arch:
  - amd64
containerSupport: full
dockerImage: factoriotools/factorio:stable
dockerDataMount: /factorio
dockerEnv:
  GENERATE_NEW_SAVE: "true"
  SAVE_NAME: playon
  LOAD_LATEST_SAVE: "false"
adminDialect: none
queryDialect: factorio
join:
  clientSetupNotes: >
    Factorio → Multiplayer → Connect to address → {{host}}:{{port}} (UDP game port).
minRamMb: 2048
requiredTools:
  - servers_create_from_skill
  - servers_start
  - panel_publish
ports:
  - name: game
    protocol: udp
    default: 34197
  - name: rcon
    protocol: tcp
    default: 27015
dependencies:
  - platform.docker-basics
  - platform.networking-lan
  - platform.capacity
  - platform.hostability
  - platform.admin-protocols
healthChecks:
  - id: process
    type: process_running
    onFail: restart
