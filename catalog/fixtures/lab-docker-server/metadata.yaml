name: fixtures.lab-docker-server
version: 0.1.0
game: Lab Docker Server
description: >
  Minimal Docker skill for unit/integration tests. Not a curated games.* package —
  real game skills come from the playon.games catalog.
tags:
  - fixture
  - docker
  - ci
os:
  - linux
  - windows
arch:
  - amd64
containerSupport: full
dockerImage: itzg/minecraft-server:latest
dockerDataMount: /data
dockerEnv:
  EULA: "TRUE"
  TYPE: PAPER
  ONLINE_MODE: "FALSE"
  MAX_PLAYERS: "5"
  ENABLE_RCON: "true"
adminDialect: mc_rcon
queryDialect: minecraft_status
minRamMb: 1024
ports:
  - name: game
    protocol: tcp
    default: 25565
  - name: rcon
    protocol: tcp
    default: 25575
dependencies:
  - platform.docker-basics
healthChecks:
  - id: process
    type: process_running
    onFail: restart
  - id: game-port
    type: tcp_port
    portName: game
    port: 25565
    onFail: restart
watchers:
  # Lab equivalent of the platform Health monitor (enabled for new servers).
  # workshop_update must stay notify-only and is not declared here.
  - name: Health restart
    defaultEnabled: true
    cooldownMs: 300000
    debounceMs: 30000
    trigger:
      kind: health
      onFail:
        - restart
    action:
      kind: tools
      steps:
        - tool: servers_health_check
          args:
            remediate: true
  - name: Escalate to monitor agent
    defaultEnabled: false
    cooldownMs: 300000
    trigger:
      kind: health
      onFail:
        - escalate
    action:
      kind: agent
      includeContext: true
      prompt: >
        A health check escalated on this lab server. Diagnose using servers_health_check,
        servers_logs_tail, and servers_query. Remediate if safe (restart or fix config),
        otherwise summarize the failure for the host.
