# PlayOn — do not auto-restart Home or node-agent after library upgrades.
# needrestart after unattended-upgrades bounced playon.service (KillMode=mixed
# on older units) and SIGKILLed every native game (#1038 / #1045).
#
# 0 = list only / do not restart matching units.
# The pattern also covers playon-node, playon-node-agent, and playon-server-*.
$nrconf{override_rc}{qr(^playon)} = 0;
