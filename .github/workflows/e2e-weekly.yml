# Weekly Playwright smoke (#44). Not part of every PR CI until stable.
name: e2e-weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test:e2e:install
      - name: Playwright smoke
        id: e2e
        run: pnpm test:e2e
      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYON_LAB_FILE_ISSUES: "1"
        run: |
          mkdir -p tmp
          node -e '
            const fs = require("fs");
            fs.writeFileSync("tmp/agent-loop-status.json", JSON.stringify({
              ok: false,
              mode: "e2e-weekly",
              failedLayer: "e2e",
              results: [{ name: "e2e", ok: false, code: 1, tail: "pnpm test:e2e failed — see Actions run logs" }],
              startedAt: new Date().toISOString(),
              finishedAt: new Date().toISOString(),
            }, null, 2));
          '
          # Reuse verify filer with a one-off title path: map e2e via verify fingerprint
          node scripts/lab-file-github-issues.mjs --from verify
