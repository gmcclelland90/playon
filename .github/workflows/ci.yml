name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # Full loop:verify (int/agent + Venice) stays on the Linux lab host.
      - run: pnpm verify

  packaging-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: dist-home/playon-home-*-linux-x64.tar.gz
          - os: windows-latest
            artifact_glob: dist-home/playon-home-*-windows-x64.zip
    runs-on: ${{ matrix.os }}
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux zip tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip
      - run: pnpm install
      - run: pnpm build
      - run: pnpm package:home
      - name: Assert Home artifact
        shell: bash
        run: |
          ls -la dist-home/
          shopt -s nullglob
          files=(${{ matrix.artifact_glob }})
          echo "Found: ${files[*]}"
          test "${#files[@]}" -ge 1
      - name: Upload Home artifact
        uses: actions/upload-artifact@v4
        with:
          name: playon-home-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
      - name: MVP package smoke (Linux only)
        if: runner.os == 'Linux'
        run: |
          node scripts/package-mvp.mjs
          test -f dist-package/playon-mvp.zip

  image-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/Dockerfile -t playon:ci .
