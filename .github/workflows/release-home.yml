name: release-home

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            home_glob: dist-home/playon-home-*-linux-x64.tar.gz
            node_glob: dist-node/playon-node-*-linux-x64.tar.gz
            artifact_prefix: linux
          - os: windows-latest
            home_glob: dist-home/playon-home-*-windows-x64.zip
            node_glob: dist-node/playon-node-*-windows-x64.zip
            artifact_prefix: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm package:home
      - run: pnpm package:node
      - name: Upload Home dist
        uses: actions/upload-artifact@v4
        with:
          name: home-${{ matrix.artifact_prefix }}
          path: ${{ matrix.home_glob }}
          if-no-files-found: error
      - name: Upload Node dist
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.artifact_prefix }}
          path: ${{ matrix.node_glob }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f -print
      - name: Release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/playon-home-*-linux-x64.tar.gz
            artifacts/playon-home-*-windows-x64.zip
            artifacts/playon-node-*-linux-x64.tar.gz
            artifacts/playon-node-*-windows-x64.zip
          generate_release_notes: true
          body: |
            ## PlayOn Home (portable)

            1. Download the archive for your OS
            2. Extract
            3. **Windows:** right-click `Start-PlayOn.ps1` → Run with PowerShell · **Linux:** `./start-playon.sh`
            4. Create the Owner account → Settings (LLM or MCP) → optional **Nodes** (LAN/cloud Add node) → start a game
            5. Players join via `/play` (cloud servers still advertise LAN addresses)

            Remote nodes: download the matching `playon-node-*` asset, or add via Home **Settings → Nodes**.

            In-app updates: after this release is published to playon.games (`/home/latest.json`), Owners on an older build can **Update & restart** from Settings.

            See [CHANGELOG.md](https://github.com/gmcclelland90/playon/blob/main/CHANGELOG.md) and [release pipeline](https://github.com/gmcclelland90/playon/blob/main/docs/release.md).

            No separate Node.js install required. Optional always-on: `PLAYON_SERVICE=1` on the one-liner.
      - name: Build home/latest.json (local artifacts)
        run: |
          mkdir -p dist-home dist-node
          cp -f artifacts/playon-home-* dist-home/
          cp -f artifacts/playon-node-* dist-node/
          ls -la dist-home dist-node
          node scripts/publish-home-manifest.mjs
        env:
          PLAYON_GAMES_PUBLIC: ${{ github.workspace }}/manifest-out
          PLAYON_MANIFEST_STRICT: "1"
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: home-manifest
          path: manifest-out/home/*.json
          if-no-files-found: error
      - name: Attach manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest-out/home/latest.json

  # Tell playon-games to sync OTA manifest + installers and deploy Pages.
  notify-site:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → playon-games
        env:
          # Fine-grained or classic PAT with contents:write + actions:write on playon-games.
          # Falls back to GITHUB_TOKEN only works for same-repo dispatches (not used here).
          GH_TOKEN: ${{ secrets.PLAYON_GAMES_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing secret PLAYON_GAMES_TOKEN on playon. Create a PAT that can dispatch workflows on playon-games (see docs/release.md)."
            exit 1
          fi
          gh api repos/gmcclelland90/playon-games/dispatches \
            -f event_type='playon-release' \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[version]=${VERSION}"
          echo "Dispatched playon-release for ${TAG}"
