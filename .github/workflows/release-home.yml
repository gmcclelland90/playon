name: release-home

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: dist-home/playon-home-*-linux-x64.tar.gz
          - os: windows-latest
            artifact_glob: dist-home/playon-home-*-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm package:home
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: home-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: home-*
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f -print
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/playon-home-*-linux-x64.tar.gz
            artifacts/playon-home-*-windows-x64.zip
          generate_release_notes: true
          body: |
            ## PlayOn Home (portable)

            1. Download the archive for your OS
            2. Extract
            3. **Windows:** right-click `Start-PlayOn.ps1` → Run with PowerShell · **Linux:** `./start-playon.sh`
            4. Create the Owner account in the browser, add your Venice API key, start a game

            No separate Node.js install required. Optional always-on install: `deploy/install.sh` / `deploy/windows/install.ps1`.
