name: nightly-docker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  paper-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout playon-games for skills
        uses: actions/checkout@v4
        with:
          repository: gmcclelland90/playon-games
          token: ${{ secrets.PLAYON_GAMES_PAT || github.token }}
          path: playon-games
      - name: Place playon-games beside this repo
        run: |
          # Lab and resolveCatalogGamesRoot use a sibling checkout. Leaving the
          # tree inside the workspace makes pnpm test:unit scan catalog start
          # scripts (check-windows-script-ascii.mjs). Never delete a sibling
          # that was already there.
          src="$GITHUB_WORKSPACE/playon-games"
          dest="$GITHUB_WORKSPACE/../playon-games"
          if [ -e "$dest" ]; then
            echo "sibling playon-games already present at $dest; removing in-workspace checkout"
            rm -rf "$src"
          else
            mv "$src" "$dest"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Merge bar
        id: verify
        run: pnpm loop:verify
        env:
          PLAYON_LAB_FILE_ISSUES: "0"
          PLAYON_LAB_PUBLISH_STATUS: "0"
          # Int/agent layers need Venice; lab host has the key in env — GHA must too.
          PLAYON_VENICE_API_KEY: ${{ secrets.PLAYON_VENICE_API_KEY }}
          VENICE_API_KEY: ${{ secrets.PLAYON_VENICE_API_KEY }}
      - name: Real Docker Paper smoke
        id: runtime
        run: pnpm loop:verify:runtime
        env:
          PLAYON_RUNTIME: docker
          PLAYON_GAMES_SKILLS_ROOT: ${{ github.workspace }}/../playon-games/skills-src/games
          PLAYON_LAB_FILE_ISSUES: "0"
          PLAYON_LAB_PUBLISH_STATUS: "0"
          PLAYON_VENICE_API_KEY: ${{ secrets.PLAYON_VENICE_API_KEY }}
          VENICE_API_KEY: ${{ secrets.PLAYON_VENICE_API_KEY }}
      - name: File GitHub issues from failed bar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYON_LAB_FILE_ISSUES: "1"
        run: node scripts/lab-file-github-issues.mjs --from verify
      - name: Lab report (summary + HTML)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYON_LAB_REPORT_TITLE: nightly-docker
          PLAYON_LAB_HOST_LABEL: github-actions
          PLAYON_LAB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYON_LAB_PUBLISH_STATUS: "1"
        run: |
          node scripts/lab-report.mjs --title "nightly-docker"
          node scripts/lab-publish-status.mjs --force --history-comment || true
      - name: Upload lab-report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-report-nightly
          path: |
            tmp/lab-report.html
            tmp/lab-report.md
          if-no-files-found: ignore
